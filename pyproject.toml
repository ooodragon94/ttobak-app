[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttobak"
version = "0.1.0"
description = "한글 자모로 낱말을 맞히는 놀이. 친구들끼리 방에서 매일 같은 문제를 푼다."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "itsdangerous>=2.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    # 카톡 미리보기 그림(static/og.png)을 만드는 데만 쓴다.
    # 서버가 도는 데는 필요 없어서 개발 쪽에만 둔다 —
    # 실제 운영 계정에는 안 깔린다.
    "pillow>=10.0",
]

[project.scripts]
ttobak = "ttobak.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ttobak"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# 테스트 이름은 한글 문장으로 쓴다. 한글에는 대소문자가 없어 N802가 오탐한다.
"tests/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["ttobak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
